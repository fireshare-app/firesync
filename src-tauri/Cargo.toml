[package]
name = "firesync"
version = "0.1.3"
description = "Watches folders and uploads new clips and screenshots to Fireshare"
authors = ["Shane Israel"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows. See rust-lang/cargo#8519.
name = "firesync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP lives in Rust rather than the webview: uploads have to keep running with
# the window closed, and multipart bodies are streamed rather than buffered.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "stream",
  "rustls-tls",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util"] }
# Streams a file into a multipart body instead of reading it into memory: a
# 3 GB clip must not become 3 GB of RSS.
tokio-util = { version = "0.7", features = ["io"] }
rand = "0.8"
# Wrapping the upload stream to count bytes as they leave.
futures-util = "0.3"
# The same identity Fireshare files videos under, so a backlog can be checked
# against the library before anything is transferred.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Moving to the OS trash rather than unlinking, so "remove after upload" has an
# undo for anyone who wants one.
trash = "5"

# The token belongs in the OS credential store, never in the config file.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }

# Canonicalises without Windows' \\?\ extended-length prefix, which std adds
# unconditionally and which nothing here wants.
dunce = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

# The ledger. Bundled SQLite so there is no system dependency to chase on a
# user's machine.
rusqlite = { version = "0.32", features = ["bundled"] }

# Filesystem watching. The debouncer matters as much as the watcher: recorders
# emit a storm of write events per file.
notify = "7"
notify-debouncer-full = "0.4"
tauri-plugin-clipboard-manager = "2.3.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

# Asking Windows whether a game currently owns the screen. One call, but it is
# the only correct way to ask.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
